name: Build Movi Lover APK

# যখন এই রিপোজিটরিতে (অ্যাপের খোলস) কিছু push হবে, অথবা হাতে "Run workflow" চাপবেন
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # Release-এ APK আপলোডের জন্য

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # ঐচ্ছিক (বেশি নিরাপদ): নিজের গোপন কিস্টোর Secrets-এ রাখলে সেটাই ব্যবহার হবে — README দেখুন
      - name: Use private keystore (if provided)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > release.keystore; echo "private keystore in use"; fi

      - name: Build signed release APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
          # ঐচ্ছিক: রিপোজিটরি Settings → Variables → SITE_URL দিলে site-url.txt-এর বদলে ওটা ব্যবহার হবে
          SITE_URL: ${{ vars.SITE_URL }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MoviLover.apk

      - name: Publish release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Movi Lover v${{ github.run_number }}
          make_latest: true
          files: MoviLover.apk
          body: |
            Movi Lover অ্যাপ (Android)। ডাউনলোড: নিচের MoviLover.apk।
            সাইটের আপডেট অ্যাপে নিজে থেকেই আসে।
