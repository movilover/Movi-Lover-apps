plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// সাইটের লিংক নির্ধারণ (SITE_URL না পাওয়া গেলে site-url.txt অথবা ডিফল্ট ইউআরএল ব্যবহার হবে)
def envSite = System.getenv('SITE_URL')
def siteUrlFile = rootProject.file('site-url.txt')
def rawUrl = (envSite != null && !envSite.trim().isEmpty()) ? envSite : (siteUrlFile.exists() ? siteUrlFile.text.trim() : '')

def siteUrl = (rawUrl.isEmpty() || rawUrl.contains('YOUR-') || !rawUrl.startsWith('https://')) ? "https://example.com" : rawUrl
def runNumber = (System.getenv('RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.movilover.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.movilover.app'
        minSdk 21
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
        buildConfigField 'String', 'SITE_URL', "\"${siteUrl}\""
    }

    signingConfigs {
        release {
            storeFile rootProject.file('release.keystore')
            storePassword (System.getenv('KS_PASS') ?: 'movilover123')
            keyAlias (System.getenv('KS_ALIAS') ?: 'movilover')
            keyPassword (System.getenv('KS_PASS') ?: 'movilover123')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
